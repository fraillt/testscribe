name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # checkout-domain compiles its sqlx queries from the committed .sqlx cache,
  # so CI needs no running database
  SQLX_OFFLINE: "true"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install taplo
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz \
            | gunzip > taplo
          chmod +x taplo
          sudo mv taplo /usr/local/bin/

      - name: TOML formatting (taplo fmt)
        run: taplo fmt --check

      - name: Rust formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The frontend is a workspace of its own, with a UI next to it.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/ui/package-lock.json

      - name: UI dependencies
        run: npm ci
        working-directory: frontend/ui

      - name: UI types (svelte-check)
        run: npm run check
        working-directory: frontend/ui

      - name: UI build
        run: npm run build
        working-directory: frontend/ui

      - name: Rust formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The desktop shell needs the libraries of a webview, and the built UI.
      - name: Desktop shell
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev
          cargo clippy -p testscribe-frontend-desktop -- -D warnings
