[package]
authors.workspace = true
description = "Experimental remote-controlled test runner for the testscribe test framework"
edition.workspace = true
license.workspace = true
name = "testscribe-detached"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
testscribe-core.workspace = true
testscribe-standalone.workspace = true
tokio = { version = "1", features = ["net", "rt"] }
tokio-tungstenite = "0.28"
tungstenite = "0.28"
