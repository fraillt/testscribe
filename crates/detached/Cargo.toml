[package]
authors.workspace = true
description = "Experimental connection from testscribe tests to a remote frontend that shows and steers the run"
edition.workspace = true
license.workspace = true
name = "testscribe-detached"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
testscribe-core.workspace = true
testscribe-standalone.workspace = true
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
tokio-tungstenite = "0.28"

[dev-dependencies]
testscribe = { workspace = true, features = ["detached"] }
tokio = { version = "1", features = ["net", "rt", "macros"] }
