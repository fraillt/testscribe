[workspace]
members = ["crates/*", "examples/*"]
resolver = "3"

[workspace.package]
authors = ["Mindaugas Vinkelis <fraillt@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/fraillt/testscribe"
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
testscribe = { path = "crates/testscribe", version = "0.1.0" }
testscribe-core = { path = "crates/core", version = "0.1.0" }
testscribe-detached = { path = "crates/detached", version = "0.1.0" }
testscribe-proc-macros = { path = "crates/proc-macros", version = "0.1.0" }
testscribe-standalone = { path = "crates/standalone", version = "0.1.0" }
