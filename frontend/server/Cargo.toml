[package]
description = "The testscribe frontend server: test binaries report to it, the UI reads from it"
edition.workspace = true
license.workspace = true
name = "testscribe-frontend-server"
publish.workspace = true
version.workspace = true

[[bin]]
name = "testscribe-frontend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tokio-tungstenite = "0.28"
