[package]
description = "The testscribe frontend as a desktop app: the server and a window on its UI"
edition.workspace = true
license.workspace = true
name = "testscribe-frontend-desktop"
publish.workspace = true
version.workspace = true

[[bin]]
name = "testscribe-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
testscribe-frontend-server = { path = "../../server" }
tokio = { version = "1", features = ["net"] }
